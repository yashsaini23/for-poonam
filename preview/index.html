    // --- PROCEDURAL AMBIENT SOUND HOOK ---
    function useProceduralAudio() {
      const [isPlaying, setIsPlaying] = useState(false);
      const [isMuted, setIsMuted] = useState(false);
      const ctxRef = useRef(null);
      const gainRef = useRef(null);
      const timerRef = useRef(null);

      const notes = [138.59, 164.81, 185.0, 207.65, 246.94, 277.18];

      const playTone = useCallback((freq) => {
        const ctx = ctxRef.current;
        const master = gainRef.current;
        if (!ctx || !master || ctx.state === 'suspended') return;

        try {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const filter = ctx.createBiquadFilter();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(450, ctx.currentTime);

          const now = ctx.currentTime;
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.08, now + 2);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 7);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(master);

          osc.start(now);
          osc.stop(now + 7);
        } catch(e) {}
      }, []);

      const playChord = useCallback(() => {
        const n1 = notes[Math.floor(Math.random() * notes.length)];
        const n2 = notes[Math.floor(Math.random() * notes.length)];
        playTone(n1);
        setTimeout(() => playTone(n2), 1200);
      }, [playTone]);

      const togglePlay = async () => {
        if (!ctxRef.current) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioContext();
          ctxRef.current = ctx;
          const master = ctx.createGain();
          master.gain.setValueAtTime(isMuted ? 0 : 0.25, ctx.currentTime);
          master.connect(ctx.destination);
          gainRef.current = master;
        }

        if (isPlaying) {
          if (timerRef.current) clearInterval(timerRef.current);
          if (ctxRef.current.state === 'running') ctxRef.current.suspend();
          setIsPlaying(false);
        } else {
          if (ctxRef.current.state === 'suspended') await ctxRef.current.resume();
          setIsPlaying(true);
          playChord();
          timerRef.current = setInterval(playChord, 6500);
        }
      };

      const toggleMute = () => {
        if (!gainRef.current || !ctxRef.current) return;
        const nextMuted = !isMuted;
        setIsMuted(nextMuted);
        gainRef.current.gain.setValueAtTime(nextMuted ? 0 : 0.25, ctxRef.current.currentTime);
      };

      return { isPlaying, isMuted, togglePlay, toggleMute };
    }

                        }`}
                      >
                        <span className="font-mono text-xs text-mutedRose font-bold">Option {k}</span>
                        <h4 className="font-serif text-xl text-warmIvory mt-2 mb-1">{item.label}</h4>
                        <p className="text-xs font-mono text-softGrey">{item.sublabel}</p>
                      </button>
                    );
                  })}
                </div>

                {angerChoice && (
                  <div className="p-7 rounded-2xl bg-deepNavy border border-mutedRose/30 space-y-3">
                    <span className="text-xs font-mono uppercase text-mutedRose">Yash's response:</span>
                    <div className="font-serif text-lg text-warmIvory space-y-1">
                      {QUESTION_BRANCHES[angerChoice].reactionLines.map((l, i) => (
                        <p key={i}>{l}</p>
                      ))}
                    </div>
                    <p className="font-handwriting text-xl text-mutedRose pt-2">
                      ✎ {QUESTION_BRANCHES[angerChoice].note}
                    </p>
                  </div>
                )}

                <div className="pt-4 flex items-center justify-between">
                  <button onClick={() => goToChapter(2)} className="px-5 py-2.5 rounded-full text-xs font-mono text-softGrey">← Back</button>
                  <button onClick={() => goToChapter(4)} className="px-7 py-3 rounded-full bg-mutedRose text-midnight font-medium text-sm transition-all hover:scale-105">
                    {angerChoice ? 'Keep going →' : 'Continue anyway →'}
                  </button>
                </div>
              </div>
            )}

            {/* CHAPTER 5: LITTLE THINGS */}
            {currentChapterIndex === 4 && (
              <div className="space-y-8 animate-fadeIn">
                <div className="text-center space-y-3">
                  <span className="font-mono text-xs uppercase tracking-widest text-mutedRose px-3 py-1 rounded-full bg-mutedRose/10 border border-mutedRose/20">
                    Chapter 05 — The Familiar Everyday
                  </span>
                  <h1 className="font-serif text-3xl sm:text-5xl text-warmIvory font-medium">
                    Funny how some people become part of your everyday.
                  </h1>
                </div>

                <BubuDuduSVG scene="littleThings" />
                <p className="text-xs font-handwriting text-mutedRose/80 text-center -mt-4">
                  Bubu tried. Dudu listened.
                </p>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                  {LITTLE_THINGS_CONFIG.map((c) => (
                    <div key={c.id} className="p-6 rounded-2xl bg-deepNavy/70 border border-white/10 flex flex-col justify-between">
                      <div>
                        <span className="font-mono text-xs text-mutedRose px-2 py-0.5 rounded bg-mutedRose/10">{c.number}</span>
                        <p className="text-warmIvory text-base mt-3 leading-relaxed font-serif">{c.text}</p>
                      </div>
                      <p className="font-handwriting text-lg text-mutedRose/90 mt-4 pt-3 border-t border-white/5">— {c.annotation}</p>
                    </div>
                  ))}
                </div>

                <div className="p-6 rounded-2xl bg-deepNavy border border-mutedRose/20 text-center space-y-2 max-w-lg mx-auto">
                  <p className="font-serif text-xl text-warmIvory italic">"I won't name names."</p>
                  <p className="font-serif text-2xl text-mutedRose font-medium">"Okay, fine. It's you."</p>
                </div>

                <div className="pt-4 flex items-center justify-between">
                  <button onClick={() => goToChapter(3)} className="px-5 py-2.5 rounded-full text-xs font-mono text-softGrey">← Back</button>
                  <button onClick={() => goToChapter(5)} className="px-7 py-3 rounded-full bg-mutedRose text-midnight font-medium text-sm transition-all hover:scale-105">
                    Something deeper →
                  </button>
                </div>
              </div>
            )}

            {/* CHAPTER 6: UNSAID THINGS */}
            {currentChapterIndex === 5 && (
              <div className="space-y-8 animate-fadeIn">
                <div className="text-center space-y-3">
                  <span className="font-mono text-xs uppercase tracking-widest text-mutedRose px-3 py-1 rounded-full bg-mutedRose/10 border border-mutedRose/20">
                    Chapter 06 — Self-Reflection
                  </span>
                  <h1 className="font-serif text-3xl sm:text-5xl text-warmIvory font-medium">
                    There's something about me you probably already know.
                  </h1>
                </div>

                <BubuDuduSVG scene="unsaidThings" />
                <p className="text-xs font-handwriting text-mutedRose/80 text-center -mt-4">
                  Even Bubu needs a break.
                </p>

                <div className="p-8 sm:p-12 rounded-3xl bg-deepNavy/80 border border-lavender/20 shadow-2xl space-y-6 font-serif text-lg leading-relaxed">
                  <p className="font-medium text-2xl text-mutedRose italic">I overthink.</p>
                  <p className="text-warmIvory/85">Sometimes I feel something and spend so much time figuring out how to express it that I end up expressing it in the worst possible way.</p>
                  <p className="text-warmIvory/85">Sometimes I care and accidentally make that care look like pressure.</p>
                  <p className="text-warmIvory/85">And sometimes, instead of giving things the space they need, I try too hard to fix them immediately.</p>
                  <p className="text-softGrey font-light">I'm not saying this to justify anything.</p>
                  <p className="text-warmIvory">I'm saying it because I recognize that understanding my own emotions also means understanding how they affect someone else.</p>

                  <div className="p-5 rounded-2xl bg-midnight/60 border-l-4 border-lavender space-y-2 font-sans text-base text-warmIvory mt-4">
                    <p className="text-lavender font-medium">I'm learning that caring about someone doesn't mean constantly needing reassurance.</p>
                    <p className="text-softGrey">Sometimes it means being patient. Sometimes it means listening.</p>
                    <p className="text-warmIvory font-medium">And sometimes it simply means allowing someone to breathe.</p>
                  </div>
                </div>

                <div className="pt-4 flex items-center justify-between">
                  <button onClick={() => goToChapter(4)} className="px-5 py-2.5 rounded-full text-xs font-mono text-softGrey">← Back</button>
                  <button onClick={() => goToChapter(6)} className="px-7 py-3 rounded-full bg-mutedRose text-midnight font-medium text-sm transition-all hover:scale-105">
                    One last thought →
                  </button>
                </div>
              </div>
            )}

            {/* CHAPTER 7: QUIET CONFESSION */}
            {currentChapterIndex === 6 && (
              <div className="space-y-8 animate-fadeIn">
                <div className="text-center space-y-3">
                  <span className="font-mono text-xs uppercase tracking-widest text-mutedRose px-3 py-1 rounded-full bg-mutedRose/10 border border-mutedRose/20">
                    Chapter 07 — The Quiet Reflection
                  </span>
                  <h1 className="font-serif text-3xl sm:text-5xl text-warmIvory font-medium">
                    One last thing. And no, this isn't another disclaimer.
                  </h1>
                </div>

                <BubuDuduSVG scene="confession" />
                <p className="text-xs font-handwriting text-mutedRose/80 text-center -mt-4">
                  Somewhere between a thousand thoughts...
                </p>

                <div className="p-8 sm:p-14 rounded-3xl bg-midnight/90 border border-mutedRose/20 shadow-2xl space-y-7 font-serif text-lg sm:text-xl leading-relaxed">
                  <p className="text-warmIvory">
                    I sometimes wonder how certain people manage to become a familiar part of our thoughts without ever announcing that they're doing so.
                  </p>
                  <div className="pl-4 border-l-2 border-mutedRose/40 space-y-2 text-softGrey">
                    <p>No grand entrance.</p>
                    <p>No particular moment that explains everything.</p>
                    <p>Just a collection of little things.</p>
                  </div>
                  <div className="space-y-1 text-warmIvory/90">
                    <p>A conversation here.</p>
                    <p>A laugh there.</p>
                    <p>An ordinary day that somehow feels a little different because they were a part of it.</p>
                  </div>
                  <p className="text-mutedRose font-medium">
                    And before you know it, their name starts appearing in thoughts where it wasn't even invited.
                  </p>
                  <p className="text-softGrey">
                    I don't really know what to call that. Maybe some feelings don't need an immediate definition. Maybe some people simply become important in ways that are difficult to explain.
                  </p>
                  <div className="pt-4 border-t border-white/10 space-y-2">
                    <p className="text-warmIvory">
                      And if I've ever made you feel that my inability to express myself means your presence doesn't matter...
                    </p>
                    <p className="text-mutedRose font-semibold italic text-xl">
                      I hope this makes that a little clearer.
                    </p>
                  </div>
                  <div className="pt-6 flex flex-col items-end">
                    <p className="font-serif italic text-softGrey text-right text-base">
                      "Somewhere between a thousand thoughts,<br/>
                      you became one I never quite learned to silence."
                    </p>
                    <span className="font-handwriting text-3xl text-mutedRose mt-2">— Y.</span>
                  </div>
                </div>

                <div className="pt-4 flex items-center justify-between">
                  <button onClick={() => goToChapter(5)} className="px-5 py-2.5 rounded-full text-xs font-mono text-softGrey">← Back</button>
                  <button onClick={() => goToChapter(7)} className="px-7 py-3 rounded-full bg-mutedRose text-midnight font-medium text-sm transition-all hover:scale-105">
                    The final letter →
                  </button>
                </div>
              </div>
            )}

            {/* CHAPTER 8: THE FINAL LETTER */}
            {currentChapterIndex === 7 && (
              <div className="space-y-8 animate-fadeIn">
                <div className="text-center space-y-2">
                  <span className="font-mono text-xs uppercase tracking-widest text-mutedRose px-3 py-1 rounded-full bg-mutedRose/10 border border-mutedRose/20">
                    Chapter 08 — The Final Chapter
                  </span>
                </div>

                <BubuDuduSVG scene="finalLetter" />
                <p className="text-xs font-handwriting text-mutedRose/80 text-center -mt-4">
                  Bubu tried. Dudu approved the handoff.
                </p>

                {finalLetterClosed ? (
                  <div className="p-10 rounded-3xl bg-deepNavy border border-mutedRose/30 text-center space-y-4">
                    <h2 className="font-serif text-3xl text-warmIvory font-medium">Thank you for reading, Poonam.</h2>
                    <p className="text-softGrey text-base max-w-md mx-auto leading-relaxed">
                      No rush, no expectations. Take whatever time you need. This little digital corner will remain right here whenever you want to revisit.
                    </p>
                    <div className="font-handwriting text-3xl text-mutedRose">— Yash</div>
                    <button
                      onClick={() => { setFinalLetterClosed(false); goToChapter(0); }}
                      className="mt-4 px-6 py-2.5 rounded-full bg-mutedRose text-midnight font-mono text-xs"
                    >
                      Back to Chapter 01
                    </button>
                  </div>
                ) : (
                  <>
                    <div className="rounded-2xl bg-[#F5EFE8] text-[#11182A] p-7 sm:p-12 shadow-2xl space-y-6 font-serif text-base sm:text-lg leading-relaxed">
                      <div className="flex justify-between border-b border-[#11182A]/10 pb-4 text-xs font-mono text-[#11182A]/60">
                        <span>The Unspoken Words</span>
                        <span>A quiet evening</span>
                      </div>

                      <h2 className="text-2xl sm:text-3xl font-semibold text-[#11182A]">Okay, Poonam. That's all.</h2>

                      <p>I didn't build all this because I thought a website would fix everything.</p>
                      <p>I built it because sometimes I have too many things going on in my head, and putting them into words seemed like a better idea than trying to explain everything in the middle of a conversation.</p>
                      <p>I know I haven't always got things right.</p>
                      <p>I know that good intentions don't automatically make every action okay.</p>
                      <p>And I know that you have your own space, your own feelings, and your own way of looking at things.</p>
                      <p className="font-semibold text-[#11182A]">I just wanted you to know that I'm genuinely sorry for the moments I could have handled better.</p>
                      <p>And despite all my unnecessary overthinking, I hope we don't lose the little things that made our conversations feel familiar.</p>

                      <div className="p-4 rounded-xl bg-midnight/5 border-l-2 border-mutedRose font-mono text-xs sm:text-sm text-[#11182A]">
                        No expectations. No deadlines. No hidden conditions.
                      </div>

                      <p>Just a sincere apology, a few unspoken thoughts, and one request:</p>
                      <p className="italic text-lg font-semibold text-[#11182A]">Please keep being the wonderfully annoying person you are.</p>
                      <p className="font-semibold text-[#11182A]">Take care of yourself, you idiot.</p>

                      <div className="pt-4 border-t border-[#11182A]/10 flex justify-between items-center text-xs font-mono text-[#11182A]/70">
                        <span>P.S. You can now officially accuse me of being dramatic.</span>
                        <span className="font-handwriting text-3xl text-[#11182A] font-bold">— Yash.</span>
                      </div>
                    </div>

                    <div className="text-center pt-2 space-y-1">
                      <p className="font-handwriting text-xl text-mutedRose">
                        Yes, I actually made this entire website myself and found every single vocabulary word myself, which honestly took up most of my time!
                      </p>
                      <p className="text-xs font-mono text-softGrey/60">
                        Made with too many thoughts and an unreasonable amount of overthinking.
                      </p>
                    </div>

                    <div className="flex flex-col sm:flex-row items-center justify-center gap-4 pt-4">
                      <button onClick={() => goToChapter(0)} className="w-full sm:w-auto px-7 py-3 rounded-full bg-mutedRose text-midnight font-medium text-sm transition-all hover:scale-105">
                        Back to the beginning
                      </button>
                      <button onClick={() => setFinalLetterClosed(true)} className="w-full sm:w-auto px-6 py-3 rounded-full bg-deepNavy text-softGrey border border-white/10 font-mono text-xs">
                        Close this little corner
                      </button>
                    </div>
                  </>
                )}
              </div>
            )}

          </main>

          {/* FLOATING BUBU & DUDU MASCOT (BOTTOM LEFT) */}
          <div className="fixed bottom-6 left-6 z-40">
            {mascotModal && (
              <div className="absolute bottom-16 left-0 w-72 sm:w-80 p-4 rounded-2xl bg-deepNavy/95 border border-mutedRose/30 shadow-2xl text-warmIvory animate-in fade-in">
                <div className="flex justify-between items-center mb-2 pb-2 border-b border-white/10 text-xs font-mono text-lavender">
                  <span>BUBU & DUDU DISPATCH</span>
                  <button onClick={() => setMascotModal(false)} className="text-softGrey hover:text-warmIvory">✕</button>
                </div>
                <p className="font-handwriting text-xl text-warmIvory leading-snug">"{mascotText}"</p>
                <div className="mt-2 text-[11px] font-mono text-softGrey/70">Click bear again for another</div>
              </div>
            )}
            <button
              onClick={openMascot}
              className="flex items-center gap-2 px-3.5 py-2 rounded-full bg-deepNavy/90 border border-mutedRose/40 shadow-xl hover:scale-105 transition-all text-xs font-mono text-warmIvory"
            >
              <span>🐻</span>
              <span className="hidden sm:inline">Bubu & Dudu</span>
            </button>
          </div>

          {/* FLOATING RANDOM THOUGHT (BOTTOM RIGHT) */}
          <div className="fixed bottom-6 right-6 z-40">
            {randomThoughtModal && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-midnight/80 backdrop-blur-sm animate-in fade-in">
                <div className="p-8 rounded-3xl bg-deepNavy border border-mutedRose/30 shadow-2xl max-w-md w-full space-y-4">
                  <div className="flex justify-between items-center pb-2 border-b border-white/10 text-xs font-mono text-mutedRose">
                    <span>RANDOM DEV THOUGHT</span>
                    <button onClick={() => setRandomThoughtModal(false)} className="text-softGrey hover:text-warmIvory">✕</button>
                  </div>
                  <p className="font-serif text-xl text-warmIvory leading-relaxed">"{randomThoughtText}"</p>
                  <div className="pt-4 flex justify-between">
                    <button onClick={openRandomThought} className="text-xs font-mono text-mutedRose hover:underline">Another thought</button>
                    <button onClick={() => setRandomThoughtModal(false)} className="px-4 py-1.5 rounded-full bg-white/10 text-xs font-mono">Understood</button>
                  </div>
                </div>
              </div>
            )}
            <button
              onClick={openRandomThought}
              className="px-4 py-2 rounded-full bg-deepNavy/90 border border-mutedRose/40 shadow-xl hover:scale-105 transition-all text-xs font-mono text-warmIvory"
            >
              ✨ One more random thought
            </button>
          </div>

          {/* Editorial Footer */}
          <footer className="relative z-20 py-4 text-center text-xs font-mono text-softGrey/50 border-t border-white/5">
            P.S. — A little something, from Y. Built with genuine care & zero pretense.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
