    // =========================================================================
    // PROCEDURAL AMBIENT CHIMES — ON BY DEFAULT WITH INSTANT GESTURE UNLOCK
    // =========================================================================

    function useGentleChimes() {
      const [isPlaying, setIsPlaying] = useState(true);
      const ctxRef = useRef(null);
      const timerRef = useRef(null);

      const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];

      const playChime = useCallback(() => {
        if (!ctxRef.current || ctxRef.current.state === 'suspended') return;
        const ctx = ctxRef.current;
        const note = notes[Math.floor(Math.random() * notes.length)];

        try {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(note, ctx.currentTime);

          const now = ctx.currentTime;
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.06, now + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.5);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 3.5);
        } catch(e) {}
      }, []);

      const startAudioEngine = useCallback(async () => {
        try {
          if (!ctxRef.current) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            ctxRef.current = new AudioContext();
          }

          if (ctxRef.current.state === 'suspended') {
            await ctxRef.current.resume();
          }

          setIsPlaying(true);
          playChime();

          if (!timerRef.current) {
            timerRef.current = setInterval(playChime, 4500);
          }
        } catch(e) {
          // Autoplay handled on touch
        }
      }, [playChime]);

      useEffect(() => {
        startAudioEngine();

        const unlockEvents = ['click', 'touchstart', 'pointerdown', 'scroll', 'keydown'];
        const handleUnlock = () => {
          startAudioEngine();
          unlockEvents.forEach(evt => window.removeEventListener(evt, handleUnlock));
        };

        unlockEvents.forEach(evt => window.addEventListener(evt, handleUnlock, { passive: true }));

        return () => {
          unlockEvents.forEach(evt => window.removeEventListener(evt, handleUnlock));
          if (timerRef.current) clearInterval(timerRef.current);
        };
      }, [startAudioEngine]);

      const toggleSound = () => {
        if (isPlaying) {
          if (timerRef.current) clearInterval(timerRef.current);
          timerRef.current = null;
          if (ctxRef.current && ctxRef.current.state === 'running') ctxRef.current.suspend();
          setIsPlaying(false);
        } else {
          startAudioEngine();
        }
      };

      return { isPlaying, toggleSound };
    }

      };

      const handleAngerHover = () => {
        const nextAttempts = angerAttempts + 1;
        setAngerAttempts(nextAttempts);

        const quips = [
          "Oops, button slipped away! 💨",
          "Anger meter recalibrating... try again! 🐻",
          "Dudu blocked this button for your health! 🩺",

                      <div className="p-3 sm:p-4 rounded-2xl border-2 border-red-500 bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 font-mono text-center rotate-[-2deg]">
                        <span className="text-lg sm:text-2xl font-bold">💮 APPROVED BY POONAM</span>
                        <p className="text-[10px] sm:text-xs mt-1">Penalty in effect: Yash must buy snacks.</p>
                      </div>
                    )}
                  </div>

                  <div className="flex justify-between items-end pt-1 text-[11px] sm:text-xs font-mono">
                    <div>
                      <p className="opacity-70">Approved by:</p>
                      <p className="font-handwriting text-xl sm:text-2xl text-duduBrown font-bold">Dudu (Judge)</p>
                    </div>
                    <div className="text-right">
                      <p className="opacity-70">Drafted with care by:</p>
                      <p className="font-handwriting text-2xl sm:text-3xl text-bubuPink font-bold">Yash</p>
                    </div>
                  </div>
                </div>

                <div className="text-center pt-1">
                  <button
                    onClick={() => { setActiveTab('clouds'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                    className="px-5 sm:px-6 py-2.5 rounded-full bg-cloudPeach text-duduDark text-xs font-mono border hover:scale-105 transition-all"
                  >
                    ← Back to Cloud Points
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* FLOATING BUBU & DUDU QUICK MASCOT (TOUCH FRIENDLY) */}
          <div className="fixed bottom-4 left-4 sm:bottom-6 sm:left-6 z-40">
            {mascotBubble && (
              <div className={`absolute bottom-14 left-0 max-w-[calc(100vw-2rem)] w-72 p-3.5 sm:p-4 rounded-3xl border shadow-2xl animate-in fade-in ${
                isDark ? 'bg-deepNavy border-white/20 text-cloudWarm' : 'bg-white border-cloudRose text-duduDark'
              }`}>
                <div className="flex justify-between items-center pb-1 text-xs font-mono text-duduBrown font-bold">
                  <span>🐻 DUDU SAYS:</span>
                  <button onClick={() => setMascotBubble(null)} className="opacity-60 hover:opacity-100 text-sm p-1">✕</button>
                </div>
                <p className="font-handwriting text-lg sm:text-xl leading-snug">"{mascotBubble}"</p>
              </div>
            )}
            <button
              onClick={() => {
                const quotes = [
                  "Bubu says sorry. Dudu says make him buy dessert.",
                  "Dudu evaluated the apology: Approved with penalties.",
                  "He spent 3 days looking up words in a dictionary, true story.",
                  "Bubu is banned from drama for 30 business days."
                ];
                setMascotBubble(quotes[Math.floor(Math.random() * quotes.length)]);
              }}
              className="flex items-center gap-1.5 sm:gap-2 px-3.5 sm:px-4 py-2 sm:py-2.5 rounded-full bg-white dark:bg-deepNavy border-2 border-cloudPeach shadow-xl hover:scale-105 transition-all text-xs font-bold text-duduBrown dark:text-cloudWarm"
            >
              <span className="text-base sm:text-lg">🐻</span>
              <span>Ask Dudu</span>
            </button>
          </div>

          {/* EDITORIAL FOOTER */}
          <footer className={`py-4 sm:py-6 text-center text-[10px] sm:text-xs font-mono border-t px-4 ${
            isDark ? 'border-white/10 opacity-60' : 'border-[#F0E6DF] text-duduBrown opacity-80'
          }`}>
            P.S. — Made with fluffy clouds, zero letters, authentic Bubu & Dudu, and genuine care. — Y.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
